# O catálogo da loja.
#
# Isto é dado, não código: para acrescentar um app não se mexe em Python
# nenhum, acrescenta-se um bloco aqui. Quem escreve uma receita nova só precisa
# entender este arquivo.
#
# Campos:
#   id            identificador estável; é o nome da pasta/unidade também.
#   kind          builtin | service | container | recipe
#   category      home | media | network | storage | automation | camera |
#                 productivity | dev | server
#   ram_mb        RSS ocioso MEDIDO num Raspberry Pi, não número de fabricante.
#                 É com ele que a loja responde "isso roda na minha placa?".
#   disk_mb       espaço depois de instalado.
#   icon          nome de ícone de traço (a interface desenha). Nunca emoji.
#   requires_usb  precisa de um adaptador espetado.
#   requires_node versão mínima do Node.js.
#   install_minutes  quando passa de uns 5 minutos, para a tela poder avisar.
#   container     só para kind: container. Define o que o instalador roda de
#                 verdade (docs/CONCEITO.md seção 9). Um único container por
#                 app -- nada aqui orquestra docker-compose.
#     image           referência da imagem, com tag.
#     ports           lista de {host, container}, portas 1-65535.
#     volumes         lista de {name, path, mode}; name vira uma pasta dentro
#                     dos dados do app (~/.project_os/data/<id>/<name>), path é
#                     onde ela é montada dentro do container, mode é rw ou ro.
#     env             mapa NOME: valor de variáveis de ambiente.
#   apt           só para kind: service. O pacote Debian que instala isto de
#                 verdade, pelo mesmo instalador da tela de Programas (apt-get,
#                 com log ao vivo). Sem este campo a loja diz, no cartão, que
#                 ainda não instala daqui -- em vez de mostrar um botão que
#                 termina em "installer_pending".
#   Sem container: aqui, a loja lista o app mas o instalador ainda responde
#   "installer_pending" -- mais honesto que fingir suporte a compose ou a
#   passagem de dispositivo (/dev/video*, Coral) que este instalador não faz.
#
# Nada aqui vem instalado. Uma instalação limpa do project-os não tem app nenhum.

- id: birdtunes
  name: BirdTunes
  icon: bird
  kind: builtin
  category: media
  ram_mb: 8
  disk_mb: 5
  summary: Música pros passarinhos, na hora que você marcar.
  description: >-
    Toca uma playlist aleatória em Apple TV, HomePod ou Chromecast dentro das
    janelas de horário que você definir. Aceita arquivos locais (mp3, flac, ogg,
    wav, m4a) e importa do YouTube.
  tags: [áudio, airplay, chromecast, agenda]

# --------------------------------------------------------------------- casa
