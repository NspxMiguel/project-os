  ram_mb: 150
  disk_mb: 700
  summary: Firmware pra ESP32/ESP8266, feito por YAML.
  description: >-
    Compila e grava firmware nos seus microcontroladores. Compilar num Pi 3 é
    lento — de alguns minutos por placa — e a compilação acontece dentro do
    próprio ESPHome, não passa pela fila de ajudantes do project-os.
  tags: [casa, esp32, diy]

- id: zwave-js-ui
  name: Z-Wave JS UI
  icon: broadcast
  kind: service
  category: home
  ram_mb: 130
  disk_mb: 350
  requires_usb: true
  summary: Z-Wave, com adaptador USB.
  description: Controla uma rede Z-Wave e expõe tudo por MQTT ou websocket.
  tags: [casa, z-wave]

- id: homebridge
  name: Homebridge
  icon: home
  kind: service
  category: home
  ram_mb: 120
  disk_mb: 300
  summary: Põe no HomeKit o que o fabricante não pôs.
  description: >-
    Ponte para a Casa da Apple. Útil justamente pro que já existe aqui: o que
    aparecer no project-os pode virar acessório no iPhone.
  tags: [casa, homekit, apple]

- id: node-red
  name: Node-RED
  icon: flow
  kind: service
  category: automation
  ram_mb: 90
  disk_mb: 300
  summary: Automações ligando caixinhas com o mouse.
  description: Editor de fluxos. Precisa de Node.js, que o instalador resolve.
  tags: [automação, fluxos]

- id: n8n
  name: n8n
  icon: flow
  kind: container
  category: automation
  ram_mb: 350
  disk_mb: 900
  summary: Automação entre serviços da internet.
  description: >-
    O primo do Node-RED virado pra fora de casa: liga API com API, planilha com
    mensagem. Pesado para uma placa pequena.
  tags: [automação, integração]
  container:
    image: "docker.n8n.io/n8nio/n8n:latest"
    ports:
      - host: 5678
        container: 5678
    volumes:
      - name: data
        path: /home/node/.n8n
        mode: rw
    env:
      TZ: "America/Sao_Paulo"
      N8N_PORT: "5678"

# -------------------------------------------------------------------- mídia
- id: jellyfin
  name: Jellyfin
  icon: film
  kind: service
  category: media
  ram_mb: 300
  disk_mb: 900
  install_minutes: 10
  summary: Seus filmes e séries em qualquer tela da casa.
  description: >-
    Servidor de mídia sem conta e sem assinatura. Um Pi entrega bem quando a TV
    consegue tocar o arquivo do jeito que ele está; quando precisa converter na
    hora, engasga — e essa conversão é dentro do Jellyfin, um ajudante ligado
    não tira esse peso da placa.
  tags: [filmes, séries, streaming]

- id: navidrome
  name: Navidrome
  icon: music
  kind: service
  category: media
  ram_mb: 80
  disk_mb: 120
  summary: Sua discoteca, tocando de qualquer lugar.
  description: >-
    Servidor de música compatível com Subsonic; toca no celular, no navegador e
    dentro do BirdTunes. Leve o suficiente para qualquer placa.
  tags: [música, flac, subsonic]

- id: audiobookshelf
  name: Audiobookshelf
  icon: book
  kind: container
  category: media
  ram_mb: 200
  disk_mb: 400
  summary: Audiolivros e podcasts, com o ponto guardado.
  description: Lembra onde você parou em cada aparelho.
  tags: [audiolivro, podcast]
  container:
    image: "ghcr.io/advplyr/audiobookshelf:latest"
    ports:
      - host: 13378
        container: 80
    volumes:
      - name: audiobooks
        path: /audiobooks
        mode: rw
      - name: podcasts
        path: /podcasts
        mode: rw
      - name: config
        path: /config
        mode: rw
      - name: metadata
        path: /metadata
        mode: rw
    env:
      TZ: "America/Sao_Paulo"

- id: immich
