  kind: service
  category: home
  ram_mb: 6
  disk_mb: 15
  summary: O broker MQTT em si, se você ainda não tem um.
  description: Broker MQTT leve, instalado pelo apt e supervisionado pelo project-os.
  apt: mosquitto
  tags: [casa, mqtt, infra]

- id: home-assistant
  name: Home Assistant
  icon: home
  kind: service
  category: home
  ram_mb: 450
  disk_mb: 2200
  install_minutes: 25
  summary: A central de casa inteligente que fala com quase tudo.
  description: >-
    Instalado num venv próprio e supervisionado como serviço, não em container:
    ele precisa enxergar a rede e o USB da máquina inteira, e um container
    tiraria isso dele. A interface aparece dentro do project-os. Numa placa de
    1 GB cabe, mas não sobra muito.
  tags: [casa, hub, automação]

- id: zigbee2mqtt
  name: Zigbee2MQTT
  icon: bulb
  kind: service
  category: home
  ram_mb: 120
  disk_mb: 400
  requires_usb: true
  summary: Zigbee sem a ponte do fabricante.
  description: >-
    Precisa de um adaptador Zigbee USB. Publica tudo em MQTT, então funciona com
    o app MQTT daqui ou com o Home Assistant.
