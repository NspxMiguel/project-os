# As receitas: o que fazer com cada coisa que aparece na rede.
#
# Isto é dado, não código. Para ensinar o sistema a lidar com um aparelho novo
# acrescenta-se um bloco aqui.
#
# match/    quem esta receita atende. Toda cláusula presente precisa bater;
#           cláusula ausente não restringe nada.
#   kinds          lista de kind (discovery.KIND_CAPABILITIES)
#   capabilities   precisa ter TODAS
#   services       basta UM dos tipos mDNS
#   properties     substring, sem diferenciar maiúsculas
#   name_contains  substring do nome, pros casos em que o protocolo não diz nada
#
# steps/    em ordem. kind decide o quanto é automático:
#   install  instala um app do catálogo   -> um botão
#   config   grava uma chave das settings -> um botão
#   open     abre a interface do aparelho -> um clique
#   manual   o resto: senha, cabo, menu na TV alheia
#
# Passo manual é último recurso. Se dá pra automatizar e está como manual,
# isso é bug da receita, não escolha de estilo.
#
# Nos textos, {address} {port} {name} {host} {mac} {vendor} {id} são
# substituídos pelos valores do aparelho.

# ----------------------------------------------------------------- áudio
- id: birdtunes-airplay
  title: Tocar música em {name}
  icon: bird
  summary: >-
    {name} aceita AirPlay, então o BirdTunes pode tocar a playlist nele nos
    horários que você marcar.
  match:
    capabilities: [airplay_audio]
  steps:
    - kind: install
      app: birdtunes
      text: Instalar o BirdTunes.
    - kind: config
      values:
        apps.settings.birdtunes.output.type: airplay
        apps.settings.birdtunes.output.device_id: "{id}"
      text: Apontar o BirdTunes para {name}.
    - kind: manual
      text: >-
        Colocar os arquivos de música em /var/lib/project-os/media/birdtunes, ou
        importar do YouTube pela tela do app.
      note: Aceita mp3, flac, ogg, wav e m4a.
    - kind: manual
      text: Marcar os horários de tocar na tela do BirdTunes.

- id: birdtunes-cast
  title: Tocar música em {name}
  icon: bird
  summary: >-
    {name} é Chromecast; o BirdTunes toca direto nele sem passar por nuvem
    nenhuma.
  match:
    capabilities: [cast_media]
  steps:
    - kind: install
      app: birdtunes
      text: Instalar o BirdTunes.
    - kind: config
      values:
        apps.settings.birdtunes.output.type: chromecast
        apps.settings.birdtunes.output.device_id: "{id}"
      text: Apontar o BirdTunes para {name}.
    - kind: manual
      text: >-
        Colocar os arquivos de música em /var/lib/project-os/media/birdtunes, ou
        importar do YouTube pela tela do app.

- id: speaker-generic
  title: Ver o que dá pra tocar em {name}
  icon: speaker
  summary: >-
    {name} toca som, mas não por AirPlay nem por Chromecast. Tocar direto daqui
    depende do protocolo dele.
  match:
    kinds: [speaker]
  steps:
    - kind: manual
      text: >-
        Se ele aceita Spotify Connect, o BirdTunes não alcança; use um alto-falante
        AirPlay ou Chromecast pra playlist dos passarinhos.
    - kind: install
      app: home-assistant
      text: >-
        Instalar o Home Assistant, que tem integração pra quase todo alto-falante
        de rede e serve de ponte.

# ------------------------------------------------------------------ casa
- id: smart-device-generic
  title: Controlar {name}
  icon: bulb
  summary: >-
    É uma tomada ou lâmpada de rede, mas não sei de qual fabricante. O Home
    Assistant reconhece a maioria delas sozinho.
  match:
    kinds: [smart_plug, smart_light]
  steps:
    - kind: install
      app: home-assistant
      text: Instalar o Home Assistant.
    - kind: manual
      text: >-
        No Home Assistant, ver em Configurações > Dispositivos se {address} já
        aparece como descoberto.

- id: kasa-device
  title: Controlar {name} localmente
  icon: plug
  summary: Tomadas e lâmpadas Kasa falam na própria LAN, sem conta e sem nuvem.
  match:
    kinds: [smart_plug, smart_light]
    properties:
      vendor: tp-link
  steps:
    - kind: install
      app: kasa
      text: Instalar o app Kasa.
    - kind: manual
      text: >-
        Se for um Tapo ou um Kasa novo (KLAP), entrar uma vez com o e-mail e a
        senha da conta TP-Link nas configurações do app.
      note: Os modelos antigos não pedem conta nenhuma.

- id: tuya-device
  title: Tirar {name} da nuvem
  icon: key
  summary: >-
    Dá pra falar com aparelhos Tuya/Smart Life direto na porta 6668, mas cada um
    precisa da sua chave local.
  match:
    kinds: [tuya_device]
  steps:
    - kind: install
      app: tuya
      text: Instalar o app Tuya local.
    - kind: manual
      text: >-
        Pegar o device id e a local key deste aparelho no portal iot.tuya.com
        (conta de desenvolvedor, gratuita) e colar nas configurações do app.
      note: >-
        É o passo chato, e não tem como automatizar: a chave só existe na conta
        do fabricante.
    - kind: open
      url: "https://iot.tuya.com"
      text: Abrir o portal Tuya IoT.

- id: zigbee-stick
  title: Usar o adaptador Zigbee espetado aqui
  icon: bulb
  summary: >-
    Tem um adaptador serial em {address}. Se for um dongle Zigbee, o Zigbee2MQTT
    põe as lâmpadas e sensores dele na sua casa sem ponte de fabricante.
  match:
    kinds: [serial_device, microcontroller]
  steps:
    - kind: install
      app: mosquitto
      text: Instalar o broker MQTT (o Zigbee2MQTT publica tudo nele).
    - kind: install
      app: zigbee2mqtt
      text: Instalar o Zigbee2MQTT.
    - kind: manual
      text: >-
        No configuration.yaml do Zigbee2MQTT, pôr serial.port como {address}.
      note: >-
        Essa chave é do Zigbee2MQTT, não do project-os — quem lê o arquivo é
        ele. Guardar o valor aqui não chegaria a lugar nenhum.
    - kind: manual
      text: Colocar cada lâmpada ou sensor em modo de pareamento, um por vez.

- id: esphome-node
  title: Adotar o nó ESPHome {name}
  icon: broadcast
  match:
    kinds: [esphome]
  steps:
    - kind: install
      app: esphome
      text: Instalar o ESPHome.
    - kind: open
      url: "http://{address}"
      text: Abrir a página do nó.
    - kind: manual
      text: >-
        Se o nó pede senha de API, ela está no arquivo .yaml com que ele foi
        gravado.

- id: homekit-bridge
  title: Levar {name} pro Home Assistant
  icon: home
  summary: >-
    {name} fala HomeKit. O Home Assistant entende HomeKit direto, e a partir daí
    tudo mais aqui enxerga o aparelho.
  match:
    kinds: [homekit]
  steps:
    - kind: install
      app: home-assistant
      text: Instalar o Home Assistant.
    - kind: manual
      text: >-
        No Home Assistant, Configurações > Dispositivos > Adicionar > HomeKit
        Device, e digitar o código de 8 dígitos que está na etiqueta do aparelho.
      note: >-
        Um acessório HomeKit só fala com uma casa de cada vez. Se ele já está na
        casa do iPhone, remover de lá antes.

- id: home-assistant-found
  title: Já existe um Home Assistant em {address}
  icon: home
  summary: >-
    Achei um Home Assistant rodando em outro lugar da rede. Dá pra usar ele em
    vez de instalar um segundo aqui.
  match:
    kinds: [home_assistant]
  steps:
    - kind: config
      key: integrations.home_assistant.url
      value: "http://{address}:{port}"
      text: Usar este Home Assistant como o da casa.
    - kind: manual
      text: >-
        Gerar um token de longa duração no perfil do usuário do Home Assistant e
        colar em Ajustes > Integrações, no botão Conectar.
      note: >-
        O botão testa o endereço e o token antes de guardar; se a caixa não
        responder, ele diz isso em vez de salvar.
    - kind: open
      url: "http://{address}:{port}"
      text: Abrir o Home Assistant.

- id: mqtt-broker-found
  title: Usar o broker MQTT de {address}
  icon: broadcast
  match:
    kinds: [mqtt_broker]
  steps:
    - kind: install
      app: mqtt
      text: Instalar o app MQTT.
    - kind: manual
      text: >-
        Enquanto o app MQTT não existe, quem consome esse broker é o
        Zigbee2MQTT ou o Home Assistant — o endereço é {address}:{port}.
      note: >-
        O project-os ainda não fala MQTT sozinho; o app está no catálogo para
        você saber que está previsto.

# ---------------------------------------------------------------- mídia
- id: media-server-found
  title: Já tem um servidor de mídia em {name}
  icon: film
  summary: >-
    {name} já serve filmes na sua rede. Não precisa instalar outro aqui a não ser
    que você queira.
  match:
    kinds: [media_server]
  steps:
    - kind: open
      url: "http://{address}:{port}"
      text: Abrir {name}.
    - kind: manual
      text: >-
        Se quiser que o project-os hospede a biblioteca em vez dele, instale o
        Jellyfin pela loja e aponte para a mesma pasta.

- id: host-media
  title: Hospedar filmes e séries aqui
  icon: film
  summary: >-
    Tem uma TV na rede ({name}), então vale ter a biblioteca rodando na própria
    placa.
  match:
    kinds: [tv, chromecast, apple_tv]
  steps:
    - kind: install
      app: jellyfin
      text: Instalar o Jellyfin.
    - kind: manual
      text: >-
        Apontar a biblioteca para onde estão os arquivos (um HD USB é o normal;
        cartão de memória enche rápido).
    - kind: open
      url: "http://{host}:8096"
      text: Abrir o Jellyfin e criar o primeiro usuário.

# ------------------------------------------------------------ impressoras
- id: printer-3d
  title: Acompanhar a impressora 3D {name}
  icon: printer
  summary: >-
    {name} já tem interface web própria; o project-os só precisa saber onde ela
    fica pra te mostrar no painel.
  match:
    kinds: [printer_3d]
  steps:
    - kind: open
      url: "http://{address}:{port}"
      text: Abrir a interface da impressora.
    - kind: manual
      text: >-
        Gerar uma chave de API na impressora (OctoPrint - Configurações > API;
        Moonraker - moonraker.conf) para o painel ler o progresso.

- id: printer-cups
  title: Imprimir a partir daqui em {name}
  icon: printer
  match:
    kinds: [printer]
  steps:
    - kind: manual
      text: Instalar o CUPS na placa.
      command: sudo apt install -y cups
    - kind: manual
      text: Adicionar a impressora pelo endereço {address}.
      command: lpadmin -p {id} -E -v ipp://{address}/ipp/print -m everywhere

# --------------------------------------------------------- rede e máquinas
- id: pc-helper
  title: Usar {name} pra ajudar a placa
  icon: pulse
  summary: >-
    {name} é um computador com shell. Com o ajudante instalado nele, tarefa
    pesada daqui (converter vídeo, indexar biblioteca) roda lá.
  match:
    kinds: [computer]
  steps:
    - kind: manual
      text: >-
        Baixar o ajudante do project-os em {name} (Windows, Mac ou Linux) e rodar
        uma vez.
    - kind: manual
      text: >-
        Digitar no ajudante o código de 6 dígitos que aparece em Ajudantes aqui.
      note: >-
        Quem liga é o PC, não a placa: assim funciona mesmo com firewall e não
        exige abrir porta nenhuma na sua rede.

- id: esp32-accessory
  title: Fazer deste ESP32 um acessório da placa
  icon: broadcast
  summary: >-
    Tem um microcontrolador em {address}. Ele pode virar sensor, botão ou tela da
    placa em vez de rodar sozinho.
  match:
    kinds: [microcontroller]
  steps:
    - kind: manual
      text: Deixar o ESP32 espetado no USB durante a gravação.
    - kind: manual
      text: >-
        Gravar o Simpleproject-os pela tela de Ajudantes e escolher o papel
        (sensor, botão, tela).
      note: >-
        Depois de gravado ele conversa por Wi-Fi; o cabo só é preciso na
        primeira vez.

- id: router-found
  title: Seu roteador é {name}
  icon: broadcast
  match:
    kinds: [router]
  steps:
    - kind: open
      url: "http://{address}"
      text: Abrir a administração do roteador.
    - kind: manual
      text: >-
        Reservar um IP fixo para esta placa no DHCP do roteador, senão o endereço
        muda sozinho e os aparelhos apontados pra cá param de achar.
      note: O MAC pra reservar aparece em Sistema > Rede.

- id: nas-found
  title: Montar o disco de {name}
  icon: disk
  summary: >-
    {name} é um servidor de arquivos. Dá pra guardar mídia e backup lá em vez de
    encher o cartão da placa.
  match:
    kinds: [nas]
  steps:
    - kind: install
      app: samba
      text: Instalar o suporte a compartilhamento de arquivos.
    - kind: manual
      text: Montar o compartilhamento de {address} em /mnt.
      command: sudo mount -t cifs //{address}/nome-do-compartilhamento /mnt/nas -o username=SEU_USUARIO

- id: game-console
  title: "{name} está na rede"
  icon: apps
  summary: >-
    Não dá pra controlar um console de fora, mas ele aparecer aqui já serve pra
    duas coisas.
  match:
    kinds: [game_console]
  steps:
    - kind: manual
      text: >-
        Reservar um IP fixo pra ele no roteador se você usa jogo online com porta
        aberta.
    - kind: install
      app: pihole
      text: >-
        Instalar o Pi-hole, que corta propaganda também no console, sem precisar
        instalar nada nele.

- id: phone-found
  title: "{name} é um celular"
  icon: pulse
  match:
    kinds: [phone]
  steps:
    - kind: manual
      text: >-
        Dar um nome a este aparelho aqui na lista, pra ele parar de aparecer como
        um endereço solto.
    - kind: install
      app: home-assistant
      text: >-
        Instalar o Home Assistant se quiser usar a presença do celular (chegou em
        casa, saiu) em automação.

# ------------------------------------------------------------------ genérica
- id: web-service-found
  title: "{name} tem uma página web"
  icon: globe
  summary: >-
    Respondeu HTTP em {address}:{port}. Vale abrir pra ver o que é antes de
    decidir o que fazer com ele.
  match:
    kinds: [web_service]
  steps:
    - kind: open
      url: "http://{address}:{port}"
      text: Abrir a página.
    - kind: manual
      text: >-
        Se for algo que você quer no painel, dê um nome a ele aqui na lista; o
        atalho passa a aparecer em Dispositivos.

- id: unknown-device
  title: Não sei o que é {address}
  icon: search
  summary: >-
    Este aparelho respondeu na rede mas não disse o que é. Isso é normal: muita
    coisa não se anuncia.
  match:
    kinds: [unknown]
  steps:
    - kind: manual
      text: Dar um nome a ele aqui na lista pra reconhecer da próxima vez.
    - kind: manual
      text: Ver se ele tem uma página web.
      command: curl -sI http://{address} | head -1
      note: >-
        Se o fabricante aparecer em branco, é porque não tem a base OUI da IEEE
        instalada aqui; `sudo apt install ieee-data` resolve.
