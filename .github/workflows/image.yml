name: image

# Builds the card image. pi-gen needs an arm chroot, so this runs on a GitHub
# runner with binfmt/qemu rather than on anyone's laptop -- and the artefact of a
# tagged build is the thing you write with Etcher.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the image to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-os

      - name: Make room
        # pi-gen needs more free disk than a runner has by default.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /

      - uses: docker/setup-qemu-action@v3

      - name: Install pi-gen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git \
            curl bc gpg pigz xxd arch-test bmap-tools kmod

      - name: Check out pi-gen
        run: git clone --depth 1 --branch bookworm https://github.com/RPi-Distro/pi-gen.git

      - name: Wire project-os into pi-gen
        run: |
          cp project-os/image/config pi-gen/config
          cp -a project-os/image/stage-project-os pi-gen/stage-project-os
          # Our stage is the one that exports an image; without this pi-gen also
          # writes out a plain Raspberry Pi OS Lite, which is not the product.
          touch pi-gen/stage2/SKIP_IMAGES
          # The stage list in config points at ./image/stage-project-os as seen
          # from the repo; inside pi-gen it lives at the top level.
          sed -i 's#\./image/stage-project-os#./stage-project-os#' pi-gen/config
          {
            echo "PROJECT_OS_SRC=${GITHUB_WORKSPACE}/project-os"
            echo "export PROJECT_OS_SRC"
          } >> pi-gen/config

      - name: Build
        working-directory: pi-gen
        run: sudo -E ./build.sh

      - name: Name the image
        id: image
        run: |
          set -e
          # pi-gen runs under sudo, so everything it wrote belongs to root.
          sudo chown -R "$(id -u):$(id -g)" pi-gen/deploy
          file=$(ls pi-gen/deploy/*.img.xz | head -n1)
          version=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' project-os/project_os/__init__.py | head -n1 | tr -d '"' || true)
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          name="project-os-${version}.img.xz"
          mv "$file" "pi-gen/deploy/${name}"
          (cd pi-gen/deploy && sha256sum "${name}" > "${name}.sha256")
          echo "path=pi-gen/deploy/${name}" >> "$GITHUB_OUTPUT"
          echo "sha=pi-gen/deploy/${name}.sha256" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -lh pi-gen/deploy

      - name: Pack the rootfs as a system update
        # A imagem é como o Pi recebe o sistema a primeira vez. Isto é como ele
        # recebe todas as outras, sem o cartão sair do lugar: o mesmo sistema,
        # empacotado, para ser gravado no slot que não está rodando.
        #
        #   "n quero nunca mais ter q pegar esse sdcard e plugar no meu pc dnv"
        #
        # Sai da própria imagem recém-construída, e não de um segundo build:
        # assim é impossível a imagem e a atualização divergirem.
        id: rootfs
        run: |
          set -e
          version="${{ steps.image.outputs.version }}"
          img=$(ls pi-gen/work/*/export-image/*.img 2>/dev/null | head -n1 || true)
          if [ -z "$img" ]; then
            echo "não achei a imagem descomprimida para extrair o rootfs" >&2
            exit 1
          fi
          loop=$(sudo losetup --show -fP "$img")
          sudo mkdir -p /mnt/rootfs
          sudo mount "${loop}p2" /mnt/rootfs
          name="project-os-rootfs-${version}.tar.gz"
          # --numeric-owner: os números de uid/gid do sistema construído valem
          # mais do que os nomes da máquina que desempacota.
          sudo tar --numeric-owner -czf "pi-gen/deploy/${name}" \
            -C /mnt/rootfs --exclude=./boot/firmware/* .
          sudo umount /mnt/rootfs
          sudo losetup -d "$loop"
          sudo chown "$(id -u):$(id -g)" "pi-gen/deploy/${name}"
          (cd pi-gen/deploy && sha256sum "${name}" > "${name}.sha256")
          echo "path=pi-gen/deploy/${name}" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 < "pi-gen/deploy/${name}.sha256")" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "pi-gen/deploy/${name}")" >> "$GITHUB_OUTPUT"
          ls -lh pi-gen/deploy

      - name: Conferir a imagem antes de publicar
        # Quase cinquenta conferências no que vai para o cartão -- initramfs por
        # kernel com os módulos certos, o decisor de slot lá dentro, o fstab, o
        # sudoers, os ajudantes -- e uma simulação do primeiro boot: estica a
        # imagem para o tamanho de um cartão e roda o reparticionamento de
        # verdade, com o layout.sh de dentro da própria imagem.
        #
        # Roda depois de empacotar o rootfs de propósito: a conferência escreve
        # na imagem (é assim que ela simula o primeiro boot), então os dois
        # arquivos que vão ser publicados já estão prontos e intactos.
        #
        # Uma imagem que não passa aqui não chega ao release. O preço de publicar
        # um cartão ruim é ele com o cartão na mão de novo, que é justamente o
        # que este projeto existe para não pedir.
        #
        # 20 GB e não os 62 GB do cartão dele: o runner acabou de construir uma
        # imagem e o que sobra de disco é pouco. Vinte é o menor cartão em que os
        # dois slots de 8 GB e a partição de dados ainda cabem -- é o layout de
        # verdade, com bem menos metadado de formatação para escrever.
        run: |
          set -e
          img=$(ls pi-gen/work/*/export-image/*.img | head -n1)
          df -h /
          sudo bash project-os/scripts/verify-image-docker.sh "$img" 20000

      - uses: actions/upload-artifact@v4
        with:
          name: project-os-image
          path: |
            ${{ steps.image.outputs.path }}
            ${{ steps.image.outputs.sha }}
            ${{ steps.rootfs.outputs.path }}
          compression-level: 0

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: project-os
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "project-os $tag" --generate-notes
          gh release upload "$tag" \
            "${GITHUB_WORKSPACE}/${{ steps.image.outputs.path }}" \
            "${GITHUB_WORKSPACE}/${{ steps.image.outputs.sha }}" \
            "${GITHUB_WORKSPACE}/${{ steps.rootfs.outputs.path }}" --clobber

      - name: Announce the system update in the manifest
        # Sem esta parte o tarball existe e ninguém fica sabendo: o Pi lê o
        # manifesto, não a lista de arquivos do release.
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        working-directory: project-os
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p release
          python3 - <<'PY'
          import json, os
          caminho = "release/latest.json"
          dados = {}
          if os.path.exists(caminho):
              with open(caminho) as f:
                  dados = json.load(f)
          dados["system"] = {
              "version": "${{ steps.image.outputs.version }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.rootfs.outputs.name }}",
              "sha256": "${{ steps.rootfs.outputs.sha }}",
              "size": int("${{ steps.rootfs.outputs.size }}" or 0),
              "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}",
          }
          with open(caminho, "w") as f:
              json.dump(dados, f, indent=2)
              f.write("\n")
          PY
          git add release/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "release ${{ steps.image.outputs.version }}: sistema no manifesto"
          for tentativa in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
