name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is what a Raspberry Pi OS Bullseye box has and the code is written
        # to it; 3.11 is what the Bookworm image ships. Both, every time.
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The dev extra carries pytest and pytest-asyncio; four tests are async
      # and pytest skips straight past them without the plugin.
      #
      # 'youtube' is here so the two checks that talk to the real yt-dlp -- the
      # SponsorBlock category names and the cancel exception -- actually run.
      # They guard with importorskip, so without the package installed they go
      # green by not running, which is the worst of both: the feature he uses
      # most in BirdTunes would be covered by fakes only.
      - run: pip install -r requirements.txt -e '.[dev,youtube]'
      - run: python -m pytest -q
