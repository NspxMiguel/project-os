name: release

# The other half of the updater. The image is how the Pi gets project-os the
# first time; this is how it gets every version after that, without the card
# ever leaving the machine:
#
#   "n precisa fica tirando o pendrive, puxa pela rede"
#
# A tag publishes a source tarball, its sha256, and the manifest the running
# system polls. Refusing to install without a checksum is a rule in
# core/updates.py, so the checksum is produced here, not by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag publica direto para a caixa dele pela rede: quem instala a atualização
  # é o updater, sem ninguém olhando. Publicar de uma árvore vermelha é mandar o
  # defeito por entrega automática, então a suíte aqui é portão e não relatório.
  #
  # O workflow 'tests' roda em push para o main e em pull request -- nunca em
  # tag. Cinco versões saíram com a suíte vermelha antes desta trava existir.
  #
  # 3.11 é o Python da imagem publicada; o 'tests' cobre o 3.9 do Bullseye a
  # cada commit, e repetir a matriz aqui dobraria o tempo entre a tag e o Pi.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -e '.[dev,youtube]'
      - run: python -m pytest -q

  publish:
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushing the manifest back to main needs a token with write access.
          token: ${{ github.token }}

      - name: Work out the version
        id: v
        run: |
          version=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' project_os/__init__.py | head -n1 | tr -d '"')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v${version}" ;; esac
          # A tag that disagrees with the code would ship a version the running
          # system can never match, so it never reports itself up to date.
          if [ "${tag#v}" != "$version" ]; then
            echo "tag ${tag} does not match __version__ ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # O que mudou, em texto, colhido enquanto o checkout ainda está na tag.
      # O manifesto anunciava a URL do release neste campo, e a tela mostrava
      # esse link embaixo de "O que mudou" -- ninguém decide se atualiza olhando
      # para um endereço. A mensagem do commit da tag é o changelog que já se
      # escreve a cada versão.
      - name: Collect what changed
        id: notas
        run: |
          set -e
          git log -1 --format=%B HEAD > "$RUNNER_TEMP/notas.txt"
          wc -c < "$RUNNER_TEMP/notas.txt"

      - name: Build the tarball
        id: pack
        run: |
          set -e
          name="project-os-${{ steps.v.outputs.version }}.tar.gz"
          git archive --format=tar.gz --prefix="project-os-${{ steps.v.outputs.version }}/" \
            -o "$name" HEAD
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "project-os ${{ steps.v.outputs.version }}" --generate-notes
          gh release upload "$tag" "${{ steps.pack.outputs.name }}" --clobber

      - name: Update the manifest on main
        # O manifesto é escrito DEPOIS de trocar para o main, e nunca antes.
        # Escrever primeiro e trocar depois foi o que quebrou a publicação da
        # v0.3.7: o checkout aborta em vez de sobrescrever uma alteração local,
        # e o release saiu sem manifesto -- ou seja, a atualização pela rede,
        # que é a razão de existir deste workflow, ficou anunciando a versão
        # anterior.
        #
        # A chave "system" do manifesto é escrita pelo image.yml e anuncia o
        # rootfs A/B. Aqui ela é lida e devolvida intacta: um `cat >` apagava o
        # anúncio do sistema a cada release de aplicação, e o botão "Atualizar
        # sistema" ficava sem alvo até o próximo build de imagem -- que demora
        # uma hora e não roda a cada tag.
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p release
          python3 - <<'PY'
          import json, os
          caminho = "release/latest.json"
          dados = {}
          if os.path.exists(caminho):
              with open(caminho) as f:
                  dados = json.load(f)
          dados["version"] = "${{ steps.v.outputs.version }}"
          dados["url"] = "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.pack.outputs.name }}"
          dados["sha256"] = "${{ steps.pack.outputs.sha }}"

          # `notes` é texto e `notes_url` é endereço. Enquanto os dois moraram
          # no mesmo campo, a tela tinha um link onde precisava de um changelog.
          notas = ""
          origem = os.path.join(os.environ.get("RUNNER_TEMP", "."), "notas.txt")
          if os.path.exists(origem):
              with open(origem) as f:
                  notas = f.read().strip()
          dados["notes"] = notas[:4000]
          dados["notes_url"] = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.v.outputs.tag }}"
          with open(caminho, "w") as f:
              json.dump(dados, f, indent=2)
              f.write("\n")
          PY
          git add release/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "release ${{ steps.v.outputs.version }}: manifesto de atualização"
          # Alguém pode ter empurrado para o main enquanto o tarball subia.
          for tentativa in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
