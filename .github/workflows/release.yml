name: release

# The other half of the updater. The image is how the Pi gets project-os the
# first time; this is how it gets every version after that, without the card
# ever leaving the machine:
#
#   "n precisa fica tirando o pendrive, puxa pela rede"
#
# A tag publishes a source tarball, its sha256, and the manifest the running
# system polls. Refusing to install without a checksum is a rule in
# core/updates.py, so the checksum is produced here, not by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushing the manifest back to main needs a token with write access.
          token: ${{ github.token }}

      - name: Work out the version
        id: v
        run: |
          version=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' project_os/__init__.py | head -n1 | tr -d '"')
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v${version}" ;; esac
          # A tag that disagrees with the code would ship a version the running
          # system can never match, so it never reports itself up to date.
          if [ "${tag#v}" != "$version" ]; then
            echo "tag ${tag} does not match __version__ ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the tarball
        id: pack
        run: |
          set -e
          name="project-os-${{ steps.v.outputs.version }}.tar.gz"
          git archive --format=tar.gz --prefix="project-os-${{ steps.v.outputs.version }}/" \
            -o "$name" HEAD
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "project-os ${{ steps.v.outputs.version }}" --generate-notes
          gh release upload "$tag" "${{ steps.pack.outputs.name }}" --clobber

      - name: Update the manifest on main
        # O manifesto é escrito DEPOIS de trocar para o main, e nunca antes.
        # Escrever primeiro e trocar depois foi o que quebrou a publicação da
        # v0.3.7: o checkout aborta em vez de sobrescrever uma alteração local,
        # e o release saiu sem manifesto -- ou seja, a atualização pela rede,
        # que é a razão de existir deste workflow, ficou anunciando a versão
        # anterior.
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p release
          cat > release/latest.json <<JSON
          {
            "version": "${{ steps.v.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.pack.outputs.name }}",
            "sha256": "${{ steps.pack.outputs.sha }}",
            "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.v.outputs.tag }}"
          }
          JSON
          git add release/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "release ${{ steps.v.outputs.version }}: manifesto de atualização"
          # Alguém pode ter empurrado para o main enquanto o tarball subia.
          for tentativa in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
